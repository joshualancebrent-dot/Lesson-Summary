<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">DayBreak Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  
  <style>
    .language-selector { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    .lang-btn { border: 2px solid #5a2d82; background: transparent; color: #5a2d82; padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }
    .lang-btn.active, .lang-btn:hover { background: #5a2d82; color: #ffffff; }
    .slider-viewport { width: 100%; overflow: hidden; }
    .slider-track { display: flex; width: 500%; transition: transform 0.5s ease-in-out; }
    .slide { width: 20%; box-sizing: border-box; padding: 0 10px; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo"><span class="logo-icon">🌅</span> DayBreak</a>
      <div class="nav-actions">
        <a href="../index.html" class="btn-secondary btn-sm">← Back to Lessons</a>
        <button class="btn-login">Login</button>
      </div>
    </div>
  </header>

  <main class="content-container lesson-container">

    <header class="card lesson-header-card">
      <span class="badge" id="lesson-badge"></span>
      <h1 class="lesson-main-title" id="lesson-title"></h1>
      <p class="scripture-ref"><strong>Key Scripture:</strong> <span id="scripture-ref"></span></p>

      <blockquote class="scripture-quote">
        <span id="scripture-quote"></span>
        <cite id="scripture-cite"></cite>
      </blockquote>
    </header>

    <div class="language-selector">
      <button class="lang-btn active" onclick="switchLanguage(0, this)">English</button>
      <button class="lang-btn" onclick="switchLanguage(1, this)">Tagalog</button>
      <button class="lang-btn" onclick="switchLanguage(2, this)">Cebuano</button>
      <button class="lang-btn" onclick="switchLanguage(3, this)">Ilocano</button>
      <button class="lang-btn" onclick="switchLanguage(4, this)">Waray</button>
    </div>

    <div class="slider-viewport">
      <div class="slider-track" id="sliderTrack">
       <script type="module">
  import { lessonsData } from './lessons-data.js';

  const urlParams = new URLSearchParams(window.location.search);
  const lessonId = urlParams.get('id') || 'authentic-ministry'; 
  const lesson = lessonsData[lessonId];

  if (lesson) {
    // Populate header details
    document.getElementById('page-title').innerText = `${lesson.title} - DayBreak`;
    document.getElementById('lesson-badge').innerText = lesson.badge;
    document.getElementById('lesson-title').innerText = lesson.title;
    document.getElementById('scripture-ref').innerText = lesson.scriptureRef;
    document.getElementById('scripture-quote').innerText = `"${lesson.scriptureQuote}"`;
    document.getElementById('scripture-cite').innerText = lesson.scriptureCite;

    const languages = ['en', 'tl', 'ceb', 'ilo', 'war'];
    const sliderTrack = document.getElementById('sliderTrack');

    // Build all 5 language slides dynamically
    sliderTrack.innerHTML = languages.map(lang => {
      const content = lesson[lang];
      
      if (!content) {
        return `<div class="slide"><article class="card lesson-body"><p>Translation coming soon...</p></article></div>`;
      }

      return `
        <div class="slide">
          <section class="card lesson-media">
            <a href="${content.imageSrc}" target="_blank" class="lesson-img-link">
              <img src="${content.imageSrc}" alt="Lesson Visual" class="lesson-img">
            </a>
            <div class="media-actions">
              <a href="${content.imageSrc}" download class="btn-primary">📥 Download Lesson Visual</a>
            </div>
          </section>

          <article class="card lesson-body">
            <h2>Lesson Summary</h2>
            <h3>Main Idea:</h3>
            <p>${content.mainIdea}</p>

            <h3>Key Points in Summary</h3>
            <ul class="lesson-points">
              ${content.points.map(p => `
                <li>
                  <strong>${p.title}</strong>
                  <p>${p.description}</p>
                  <div class="takeaway-box">
                    <p class="teaching-note"><em>${p.takeaway}</em></p>
                    <strong>Question: </strong> <em>${p.question}</em>
                  </div>
                </li>
              `).join('')}
            </ul>

            <div class="synthesis-section">
              <h2>🔑 Put the Four Points Together</h2>
              <div class="flow-container">
                ${content.points.map((p, i) => `
                  <div class="flow-step"><strong>${p.flowLabel}</strong> ${p.flowText}</div>
                  ${i < content.points.length - 1 ? '<div class="flow-arrow">↓</div>' : ''}
                `).join('')}
              </div>
            </div>

            <div class="floating-box">
              <h3>Closing Thought</h3>
              <p><i>${content.closingThought}</i></p>
            </div>

            <h3>Discussion Questions</h3>
            <ol class="discussion-list">
              ${content.questions.map(q => `<li><p class="teaching-note"><em>${q}</em></p></li>`).join('')}
            </ol>
          </article>
        </div>
      `;
    }).join('');
  }
</script>  </div>
        </div>
    </section>

  </main>

  <footer><p>&copy; 2026 Daybreak Lessons. All rights reserved.</p></footer>

  <script type="module">
    import { lessonsData } from './lessons-data.js';

    // Get lesson ID from URL parameter e.g., lesson.html?id=authentic-ministry
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('id') || 'authentic-ministry'; 
    const data = lessonsData[lessonId];

    if (data) {
      document.getElementById('page-title').innerText = `${data.title} - DayBreak`;
      document.getElementById('lesson-badge').innerText = data.badge;
      document.getElementById('lesson-title').innerText = data.title;
      document.getElementById('scripture-ref').innerText = data.scriptureRef;
      document.getElementById('scripture-quote').innerText = `"${data.scriptureQuote}"`;
      document.getElementById('scripture-cite').innerText = data.scriptureCite;
      
      document.getElementById('img-link').href = data.imageSrc;
      document.getElementById('lesson-img').src = data.imageSrc;
      document.getElementById('download-link').href = data.imageSrc;
      
      document.getElementById('main-idea').innerText = data.mainIdea;
      document.getElementById('closing-thought').innerText = data.closingThought;

      // Render 4 Points
      const pointsList = document.getElementById('points-list');
      const flowContainer = document.getElementById('flow-container');
      
      pointsList.innerHTML = '';
      flowContainer.innerHTML = '';

      data.points.forEach((point, idx) => {
        // Build 4 detailed points list
        pointsList.innerHTML += `
          <li>
            <strong>${point.title}</strong>
            <p>${point.description}</p>
            <div class="takeaway-box">
              <p class="teaching-note"><em>${point.takeaway}</em></p>
              <strong>Question: </strong> <em>${point.question}</em>
            </div>
          </li>
        `;

        // Build 4 Synthesis Flow Steps
        flowContainer.innerHTML += `
          <div class="flow-step"><strong>${point.flowLabel}</strong> ${point.flowText}</div>
          ${idx < data.points.length - 1 ? '<div class="flow-arrow">↓</div>' : ''}
        `;
      });

      // Render Discussion Questions
      const questionsList = document.getElementById('questions-list');
      questionsList.innerHTML = '';
      data.questions.forEach(q => {
        questionsList.innerHTML += `<li><p class="teaching-note"><em>${q}</em></p></li>`;
      });
    }
  </script>

  <script>
    function switchLanguage(index, btnElement) {
      document.getElementById('sliderTrack').style.transform = `translateX(-${index * 20}%)`;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }
  </script>
  <script type="module" src="../script.js"></script>
</body>
</html>
