<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson Creator - DayBreak Admin</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .admin-container { max-width: 900px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .point-box { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .tab-btn { padding: 10px 20px; border: none; background: #eee; cursor: pointer; border-radius: 6px; font-weight: bold; }
    .tab-btn.active { background: #5a2d82; color: white; }
    .lang-section { display: none; }
    .lang-section.active { display: block; }
  </style>
</head>
<body>
  <div class="admin-container card">
    <h2>➕ Multi-Language Lesson Creator</h2>
    <form id="lesson-form">
      
      <!-- Top Shared Details -->
      <div class="form-group">
        <label>Lesson ID (e.g., lesson-11 or authentic-ministry):</label>
        <input type="text" id="lessonId" required>
      </div>
      <div class="form-group">
        <label>Lesson Badge (e.g., Lesson 10):</label>
        <input type="text" id="badge" required>
      </div>
      <div class="form-group">
        <label>Title:</label>
        <input type="text" id="title" required>
      </div>
      <div class="form-group">
        <label>Key Scripture Reference:</label>
        <input type="text" id="scriptureRef" required>
      </div>
      <div class="form-group">
        <label>Scripture Quote Text:</label>
        <textarea id="scriptureQuote" rows="2" required></textarea>
      </div>
      <div class="form-group">
        <label>Scripture Citation:</label>
        <input type="text" id="scriptureCite" required>
      </div>

      <hr style="margin: 25px 0;">

      <!-- Language Tabs -->
      <div class="tab-buttons">
        <button type="button" class="tab-btn active" onclick="showLang('en', this)">🇬🇧 English</button>
        <button type="button" class="tab-btn" onclick="showLang('tl', this)">🇵🇭 Tagalog</button>
      </div>

      <!-- English Form Section -->
      <div id="lang-en" class="lang-section active">
        <h3>English Content</h3>
        <div class="form-group">
          <label>Image Path/Filename:</label>
          <input type="text" id="en_imageSrc" placeholder="authentic.png" required>
        </div>
        <div class="form-group">
          <label>Main Idea Summary:</label>
          <textarea id="en_mainIdea" rows="3" required></textarea>
        </div>
        
        <h4>4 Key Points (English)</h4>
        <div id="en-points-container"></div>

        <div class="form-group">
          <label>Closing Thought:</label>
          <textarea id="en_closingThought" rows="2" required></textarea>
        </div>
        <div class="form-group">
          <label>Discussion Question 1:</label>
          <input type="text" id="en_q1" required>
        </div>
        <div class="form-group">
          <label>Discussion Question 2:</label>
          <input type="text" id="en_q2" required>
        </div>
      </div>

      <!-- Tagalog Form Section -->
      <div id="lang-tl" class="lang-section">
        <h3>Tagalog Translation</h3>
        <div class="form-group">
          <label>Tagalog Image Path/Filename:</label>
          <input type="text" id="tl_imageSrc" placeholder="resurrection-tagalog.png">
        </div>
        <div class="form-group">
          <label>Main Idea Summary (Buod):</label>
          <textarea id="tl_mainIdea" rows="3"></textarea>
        </div>
        
        <h4>4 Key Points (Tagalog)</h4>
        <div id="tl-points-container"></div>

        <div class="form-group">
          <label>Closing Thought (Pangwakas na Kaisipan):</label>
          <textarea id="tl_closingThought" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Discussion Question 1:</label>
          <input type="text" id="tl_q1">
        </div>
        <div class="form-group">
          <label>Discussion Question 2:</label>
          <input type="text" id="tl_q2">
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Generate Lesson Data JSON</button>
    </form>
    
    <div style="margin-top: 25px;">
      <label><strong>Output JSON (Copy & paste into lessons-data.js):</strong></label>
      <textarea id="json-output" rows="12" readonly style="width:100%; font-family: monospace;"></textarea>
    </div>
  </div>

  <script>
    // Build 4 Points for both languages dynamically
    ['en', 'tl'].forEach(lang => {
      const container = document.getElementById(`${lang}-points-container`);
      for (let i = 1; i <= 4; i++) {
        container.innerHTML += `
          <div class="point-box">
            <h5>Point ${i} (${lang.toUpperCase()})</h5>
            <div class="form-group"><label>Title:</label><input type="text" id="${lang}_p${i}_title"></div>
            <div class="form-group"><label>Description:</label><textarea id="${lang}_p${i}_desc" rows="2"></textarea></div>
            <div class="form-group"><label>Takeaway Note:</label><input type="text" id="${lang}_p${i}_takeaway"></div>
            <div class="form-group"><label>Question:</label><input type="text" id="${lang}_p${i}_question"></div>
            <div class="form-group"><label>Flow Label (e.g. ${i}. Transformation):</label><input type="text" id="${lang}_p${i}_flowLabel"></div>
            <div class="form-group"><label>Flow Summary Text:</label><input type="text" id="${lang}_p${i}_flowText"></div>
          </div>
        `;
      }
    });

    function showLang(lang, btn) {
      document.querySelectorAll('.lang-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`lang-${lang}`).classList.add('active');
      btn.classList.add('active');
    }

    document.getElementById('lesson-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const lessonId = document.getElementById('lessonId').value;
      
      const buildLangData = (lang) => {
        const imageSrc = document.getElementById(`${lang}_imageSrc`).value;
        if (!imageSrc) return null; // Skip language if empty

        const langData = {
          imageSrc: imageSrc,
          mainIdea: document.getElementById(`${lang}_mainIdea`).value,
          closingThought: document.getElementById(`${lang}_closingThought`).value,
          questions: [
            document.getElementById(`${lang}_q1`).value,
            document.getElementById(`${lang}_q2`).value
          ],
          points: []
        };

        for (let i = 1; i <= 4; i++) {
          langData.points.push({
            title: document.getElementById(`${lang}_p${i}_title`).value,
            description: document.getElementById(`${lang}_p${i}_desc`).value,
            takeaway: document.getElementById(`${lang}_p${i}_takeaway`).value,
            question: document.getElementById(`${lang}_p${i}_question`).value,
            flowLabel: document.getElementById(`${lang}_p${i}_flowLabel`).value,
            flowText: document.getElementById(`${lang}_p${i}_flowText`).value
          });
        }
        return langData;
      };

      const newLesson = {
        badge: document.getElementById('badge').value,
        title: document.getElementById('title').value,
        scriptureRef: document.getElementById('scriptureRef').value,
        scriptureQuote: document.getElementById('scriptureQuote').value,
        scriptureCite: document.getElementById('scriptureCite').value,
        en: buildLangData('en'),
        tl: buildLangData('tl')
      };

      const formattedOutput = `"${lessonId}": ` + JSON.stringify(newLesson, null, 2) + ",";
      document.getElementById('json-output').value = formattedOutput;
    });
  </script>
</body>
</html>
